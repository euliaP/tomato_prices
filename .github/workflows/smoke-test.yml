name: Initial Smoke Test

on:
  push:
    paths:
      - 'tomato-testing-site/**'
  pull_request:
    paths:
      - 'tomato-testing-site/**'

jobs:
  verify-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Docker Compose Stack
        working-directory: ./tomato-testing-site
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
        run: |
          # Build the images directly on the runner instead of pulling from a registry for this test
          docker-compose up -d --build
          
          echo "Giving services 15 seconds to initialize..."
          sleep 15
          
          echo "Container Status:"
          docker-compose ps -a
          
          echo "Node App Logs:"
          docker logs tomato_app

      - name: Test Node Endpoint
        run: |
          echo "Pinging the API to verify the stack is alive and secrets were passed..."
          curl -v "http://localhost:3000/tomato_price?tomato_type=cherry"
