openapi: 3.0.0
info:
  title: Tomato Prices API
  description: API documentation for the tomato pricing and image server.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /:
    get:
      summary: Serve the starter HTML page
      responses:
        '200':
          $ref: "#/components/responses/HtmlResponse"

  /tomato_page:
    get:
      summary: Serve the main tomato HTML page
      responses:
        '200':
          $ref: "#/components/responses/HtmlResponse"

  /tomato_image:
    get:
      summary: Get a tomato image
      parameters:
        - $ref: "#/components/parameters/TomatoTypeOptional"
      responses:
        '200':
          description: Successfully retrieved the image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Image file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
              example:
                error: "Image not found."

  /tomato_price:
    get:
      summary: Get the price of a specific tomato type
      parameters:
        - $ref: "#/components/parameters/TomatoTypeRequired"
      responses:
        '200':
          description: Successfully retrieved the price object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TomatoPrice"
        '400':
          $ref: "#/components/responses/BadRequestError"
        '500':
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    TomatoTypeEnum:
      type: string
      description: The identifier for the type of tomato.
      enum:
        - cherry
        - biotomato
        - regulartomato
      example: cherry
      
    TomatoPrice:
      type: object
      description: The pricing record for a specific tomato type.
      required:
        - _id
        - tomato_id
        - price
      properties:
        _id:
          type: string
          description: The internal MongoDB document ObjectID.
          format: hex
          example: 64b8f9e2a1c3d4e5f6g7h8i9
        tomato_id:
          $ref: "#/components/schemas/TomatoTypeEnum"
        price:
          type: string
          description: The formatted price string including currency and unit weight.
          format: currency-string
          example: 5 EUR per kg

    ErrorPayload:
      type: object
      description: The standardized error response returned for bad requests or server failures.
      properties:
        error:
          type: string

  parameters:
    TomatoTypeRequired:
      name: tomato_type
      in: query
      description: The identifier for the tomato type.
      required: true
      schema:
        $ref: "#/components/schemas/TomatoTypeEnum"

    TomatoTypeOptional:
      name: tomato_type
      in: query
      description: The type of tomato image to retrieve. Defaults to 'regulartomato'.
      required: false
      schema:
        $ref: "#/components/schemas/TomatoTypeEnum"

  responses:
    HtmlResponse:
      description: Successfully returned the HTML file.
      content:
        text/html:
          schema:
            type: string

    BadRequestError:
      description: Bad Request. Missing or invalid tomato_type parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
          example:
            error: "Invalid tomato_type. Must be cherry, biotomato, or regulartomato."

    InternalServerError:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
          example:
            error: "Internal server error."